version: '3.8'

services:
  api:
    build: .
    container_name: server-met-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./maps:/app/maps
      - ./environment:/app/environment
      - ./.env:/app/.env:ro
    environment:
      - NOAA_BASE_URL=https://nomads.ncep.noaa.gov/pub/data/nccf/com/gfs/prod/gfs.
      - SQLITE_DB_PATH=/app/data/sqlite/met_data.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_WORKERS=4
      - LOG_LEVEL=INFO
      - SCHEDULER_TIMEZONE=America/Sao_Paulo
      - PIPELINE_SCHEDULE_HOURS=0,6,12,18
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  scheduler:
    build: .
    container_name: server-met-scheduler
    command: python scripts/schedule.py
    volumes:
      - ./data:/app/data
      - ./maps:/app/maps
      - ./environment:/app/environment
      - ./.env:/app/.env:ro
    environment:
      - NOAA_BASE_URL=https://nomads.ncep.noaa.gov/pub/data/nccf/com/gfs/prod/gfs.
      - SQLITE_DB_PATH=/app/data/sqlite/met_data.db
      - LOG_LEVEL=INFO
      - SCHEDULER_TIMEZONE=America/Sao_Paulo
      - PIPELINE_SCHEDULE_HOURS=0,6,12,18
    restart: unless-stopped
    depends_on:
      - api

  # Optional: Run pipeline manually
  pipeline:
    build: .
    container_name: server-met-pipeline
    command: python scripts/run_pipeline.py
    volumes:
      - ./data:/app/data
      - ./maps:/app/maps
      - ./environment:/app/environment
      - ./.env:/app/.env:ro
    environment:
      - NOAA_BASE_URL=https://nomads.ncep.noaa.gov/pub/data/nccf/com/gfs/prod/gfs.
      - SQLITE_DB_PATH=/app/data/sqlite/met_data.db
      - LOG_LEVEL=INFO
    profiles:
      - manual

networks:
  default:
    name: server-met-network