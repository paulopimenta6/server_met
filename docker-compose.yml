version: '3.8'

services:
  api:
    build: .
    container_name: server-met-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./maps:/app/maps
      - ./.env:/app/.env:ro
    environment:
      - NOAA_FILTER_URL=https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_0p25.pl
      - AVIATION_WEATHER_URL=https://aviationweather.gov/api/data/metar
      - SQLITE_DB_PATH=/app/data/sqlite/met_data.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: run the data pipeline manually/seamlessly
  pipeline:
    build: .
    container_name: server-met-pipeline
    command: python scripts/process_data.py
    volumes:
      - ./data:/app/data
      - ./maps:/app/maps
      - ./.env:/app/.env:ro
    environment:
      - NOAA_FILTER_URL=https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_0p25.pl
      - AVIATION_WEATHER_URL=https://aviationweather.gov/api/data/metar
      - SQLITE_DB_PATH=/app/data/sqlite/met_data.db
      - LOG_LEVEL=INFO
    profiles:
      - manual

networks:
  default:
    name: server-met-network